<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Tracea · Pasaporte de Equipos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark sidebar app shell (always night-black like the logo) + content canvas; neon mint accents taken from the logo's glow */
:root{
  --bg:#070b09; --bg-2:#0a100d; --surface:#0e1612; --surface-2:#14201a; --surface-3:#192820;
  --line:#1e2c25; --line-2:#2b3e34;
  --fg:#e7f3ec; --fg-2:#b7cabe; --muted:#7d9588;
  --accent:#3ef08f; --accent-strong:#25d67c; --mint:#b4f6d0; --accent-soft:rgba(62,240,143,.11); --accent-line:rgba(62,240,143,.35); --accent-ink:#03140a;
  --warn:#f5b94a; --warn-soft:rgba(245,185,74,.13);
  --danger:#ff7272; --danger-soft:rgba(255,114,114,.13);
  --info:#72c9ff; --info-soft:rgba(114,201,255,.13);
  --neutral-soft:rgba(160,185,170,.12);
  --side:#030604; --side-2:#0a120e; --side-fg:#d2e6da; --side-muted:#6b8577; --side-line:#14211a;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
  --glow:0 0 0 1px var(--accent-line), 0 0 22px rgba(62,240,143,.22);
  --f-display:"Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-lg:18px; --r:12px; --r-sm:8px;
  color-scheme:dark;
}
:root[data-tracea="light"]{
  --bg:#f2f6f3; --bg-2:#e8efea; --surface:#ffffff; --surface-2:#f4f8f5; --surface-3:#eaf1ec;
  --line:#dbe5de; --line-2:#c6d4cb;
  --fg:#0b1810; --fg-2:#2d4236; --muted:#5c7165;
  --accent:#0e9c55; --accent-strong:#0a8247; --mint:#086338; --accent-soft:rgba(14,156,85,.09); --accent-line:rgba(14,156,85,.35); --accent-ink:#ffffff;
  --warn:#a86a10; --warn-soft:rgba(214,145,30,.13);
  --danger:#c23535; --danger-soft:rgba(194,53,53,.10);
  --info:#1b72a8; --info-soft:rgba(27,114,168,.10);
  --neutral-soft:rgba(70,95,80,.09);
  --shadow:0 1px 2px rgba(10,30,20,.05), 0 8px 24px rgba(10,30,20,.06);
  --glow:0 0 0 1px var(--accent-line), 0 6px 18px rgba(14,156,85,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.92rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);padding:.55rem .95rem;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);box-shadow:var(--glow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{padding:.36rem .65rem;font-size:.8rem;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:16px;height:16px;flex:none}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field>label,.lbl{font-size:.78rem;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:.74rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:.58rem .75rem;outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
textarea.input{resize:vertical;min-height:80px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem 1rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem 1rem}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}
.check{display:flex;align-items:center;gap:.5rem;font-size:.88rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:1rem}
.stack.sm{gap:.55rem}
.hr{height:1px;background:var(--line);border:0;margin:.25rem 0}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.16rem .55rem;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--fg-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.nodot::before{display:none}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;padding:.1rem .5rem;border:1px solid var(--line-2);border-radius:6px;font-size:.74rem;color:var(--fg-2)}
.demo-flag{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:.15rem .5rem;border-radius:6px}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{background:radial-gradient(120% 80% at 20% 15%, #0b2417 0%, #030604 55%);color:#dff0e6;padding-block:3rem;padding-left:max(2.5rem, env(safe-area-inset-left,0px));padding-right:2.5rem;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;position:relative;overflow:hidden}
.auth-brand .logo-xl{width:150px;height:150px;filter:drop-shadow(0 0 28px rgba(62,240,143,.45))}
.auth-brand h1{font-size:clamp(1.8rem,3.2vw,2.6rem);font-weight:600;line-height:1.12;color:#f1fbf5;max-width:16ch}
.auth-brand h1 em{font-style:normal;background:linear-gradient(90deg,#c9fbe0,#3ef08f);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand .lead{color:#9fbcab;max-width:46ch;margin-top:1rem}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;max-width:620px}
.pillar{border-top:1px solid rgba(62,240,143,.25);padding-top:.8rem}
.pillar b{display:block;font-family:var(--f-display);font-size:.92rem;color:#e8f7ee;margin-bottom:.2rem}
.pillar span{font-size:.82rem;color:#86a495}
.auth-quote{font-size:.85rem;color:#7f9e8e;max-width:58ch;border-left:2px solid rgba(62,240,143,.4);padding-left:.9rem}
.auth-main{display:flex;align-items:center;justify-content:center;padding-block:2.5rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:460px}
.tabs{display:flex;gap:.25rem;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.25rem}
.tabs button{flex:1;border:0;background:transparent;padding:.55rem .6rem;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.demo-accounts{display:grid;gap:.5rem}
.demo-acc{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.6rem .75rem;border:1px dashed var(--line-2);border-radius:10px;background:transparent;cursor:pointer;text-align:left;width:100%}
.demo-acc:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.demo-acc b{font-size:.86rem;display:block}
.demo-acc span{font-size:.76rem;color:var(--muted)}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-brand{padding-block:2rem;padding-right:max(16px, env(safe-area-inset-right,0px));padding-left:max(16px, env(safe-area-inset-left,0px))}.auth-brand .logo-xl{width:84px;height:84px}.pillars{grid-template-columns:1fr}}

/* ---------- register wizard ---------- */
.wizard{max-width:820px;margin:0 auto;padding-block:2rem 4rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.steps{display:flex;gap:.5rem;margin:1.2rem 0 1.5rem;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted);font-weight:600}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:.75rem}
.step.on{color:var(--fg)} .step.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.done i{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.step+.step::before{content:"";width:24px;height:1px;background:var(--line-2)}
.combo{position:relative}
.combo-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:.35rem}
.combo-group{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.6rem .6rem .25rem}
.combo-opt{display:flex;justify-content:space-between;gap:.75rem;width:100%;text-align:left;padding:.5rem .6rem;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:.88rem}
.combo-opt:hover,.combo-opt.hl{background:var(--accent-soft)}
.combo-opt small{color:var(--muted);white-space:nowrap}
.combo-opt.manual{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:.25rem}
.picked{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem .9rem;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:12px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%;background:linear-gradient(90deg,var(--side) 252px,transparent 252px)}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--side-line);padding-left:env(safe-area-inset-left,0px)}
.side-brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.1rem .9rem}
.side-brand img{width:40px;height:40px;filter:drop-shadow(0 0 10px rgba(62,240,143,.45))}
.side-brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.01em;color:#effaf3;display:block;line-height:1.1}
.side-brand span{font-size:.7rem;color:var(--side-muted);letter-spacing:.04em}
.side-inst{margin:.2rem .8rem .8rem;padding:.65rem .7rem;border:1px solid var(--side-line);border-radius:12px;background:var(--side-2);display:flex;gap:.6rem;align-items:center;min-width:0}
.side-inst .who{min-width:0}
.side-inst b{display:block;font-size:.84rem;color:#e6f4ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-inst small{font-size:.72rem;color:var(--side-muted)}
.nav{flex:1;overflow:auto;padding:.2rem .6rem 1rem;display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#4f6a5c;font-weight:700;padding:.9rem .6rem .35rem}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.52rem .65rem;border-radius:10px;color:var(--side-fg);text-decoration:none;font-size:.88rem;font-weight:500;border:1px solid transparent}
.nav a svg{width:18px;height:18px;flex:none;opacity:.75}
.nav a:hover{background:#0c1611}
.nav a.on{background:rgba(62,240,143,.09);border-color:rgba(62,240,143,.28);color:#effff5}
.nav a.on svg{opacity:1;color:#3ef08f}
.nav .badge{margin-left:auto;background:#3ef08f;color:#03140a;border-radius:999px;font-size:.68rem;font-weight:700;padding:.05rem .45rem}
.side-foot{padding:.8rem;border-top:1px solid var(--side-line);display:flex;gap:.6rem;align-items:center}
.side-foot .who{min-width:0;flex:1}
.side-foot b{display:block;font-size:.82rem;color:#e6f4ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot small{font-size:.72rem;color:var(--side-muted)}
.side-foot button{background:transparent;border:1px solid var(--side-line);color:var(--side-fg);border-radius:8px;padding:.35rem .5rem;cursor:pointer;font-size:.75rem}
.side-foot button:hover{border-color:rgba(62,240,143,.4)}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;font-family:var(--f-display);color:#03140a;background:linear-gradient(135deg,#b4f6d0,#3ef08f);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;border-radius:18px;font-size:1.4rem}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;padding-block:.7rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:901px){.top{padding-left:1.6rem;padding-right:max(1.6rem, env(safe-area-inset-right,0px))}}
.top h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:600px){.top .demo-flag{display:none}}
.top .spacer{flex:1}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{border-color:var(--accent-line);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.content{padding-block:1.5rem 4rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1.25rem;max-width:1320px;width:100%}
@media (min-width:901px){.content{padding-left:1.6rem;padding-right:max(1.6rem, env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:none}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:60;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .menu-btn{display:grid}
}
.banner{display:flex;gap:.9rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line-2);background:var(--surface)}
.banner.warn{border-color:color-mix(in srgb, var(--warn) 40%, transparent);background:var(--warn-soft)}
.banner.info{border-color:color-mix(in srgb, var(--info) 35%, transparent);background:var(--info-soft)}
.banner.ok{border-color:var(--accent-line);background:var(--accent-soft)}
.banner p{font-size:.88rem}

/* ---------- cards, kpis ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.15rem 1.2rem;min-width:0}
.card.pad-lg{padding:1.5rem}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.kpi .k-l{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-s{font-size:.74rem;color:var(--muted)}
.kpi.hl{border-color:var(--accent-line);background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--surface)}
.kpi.hl .k-v{color:var(--accent)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1050px){.cols,.cols.even{grid-template-columns:1fr}}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;padding:.9rem;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--accent-line);box-shadow:var(--glow)}
.quick button b{font-size:.9rem}
.quick button span{font-size:.76rem;color:var(--muted)}
.quick svg{width:22px;height:22px;color:var(--accent)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.7rem .9rem;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.mono,.tbl td.num{white-space:nowrap}
.tbl .t-main{font-weight:600}
.tbl .t-sub{font-size:.76rem;color:var(--muted)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-width:0;flex:1 1 160px}
.filters .search{flex:1 1 100%}

/* ---------- marketplace ---------- */
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.mk{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mk:hover{border-color:var(--accent-line)}
.mk-img{aspect-ratio:16/10;background:radial-gradient(90% 90% at 50% 40%, #0d2a1b, #030604);display:grid;place-items:center;position:relative;max-width:100%}
.mk-img img{width:100%;height:100%;object-fit:cover}
.mk-img svg{width:44%;height:auto;color:#3ef08f;filter:drop-shadow(0 0 8px rgba(62,240,143,.55))}
.mk-img .op{position:absolute;top:.6rem;left:.6rem}
.op-chip{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.22rem .55rem;border-radius:6px;background:#03140a;color:#3ef08f;border:1px solid rgba(62,240,143,.4)}
.op-chip.donate{color:#b4f6d0}
.op-chip.exchange{color:#72c9ff;border-color:rgba(114,201,255,.45)}
.mk-b{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.mk-b h3{font-size:.98rem}
.mk-meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.78rem;color:var(--muted)}
.mk-price{font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.mk-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem}

/* ---------- passport ---------- */
.pp-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.25rem;align-items:start}
@media (max-width:760px){.pp-head{grid-template-columns:1fr}}
.pp-id{display:flex;gap:1rem;align-items:flex-start}
.pp-thumb{width:92px;height:92px;border-radius:16px;background:radial-gradient(90% 90% at 50% 40%, #0d2a1b, #030604);display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--line-2)}
.pp-thumb img{width:100%;height:100%;object-fit:cover}
.pp-thumb svg{width:58%;color:#3ef08f;filter:drop-shadow(0 0 6px rgba(62,240,143,.55))}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1rem;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.qr-card canvas{display:block;border-radius:8px;background:#fff;image-rendering:pixelated;max-width:100%}
.qr-card .link{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);max-width:220px;word-break:break-all;text-align:center;user-select:all}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:.5rem 1rem;font-size:.9rem}
.kv dt{color:var(--muted);font-size:.82rem}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:.1rem}.kv dd{margin-bottom:.45rem}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.sec-h h2 .letter{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);margin-right:.45rem;border:1px solid var(--accent-line);border-radius:6px;padding:.05rem .35rem;vertical-align:2px}
.vis{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--muted);cursor:pointer;border:1px solid var(--line-2);border-radius:999px;padding:.18rem .6rem;background:transparent}
.vis.pub{color:var(--accent);border-color:var(--accent-line)}
.vis svg{width:13px;height:13px}
.private-note{display:flex;align-items:center;gap:.6rem;padding:.8rem;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);font-size:.86rem}
.timeline{position:relative;display:flex;flex-direction:column;gap:0;padding-left:1.4rem}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent-line),var(--line))}
.tl{position:relative;padding:.1rem 0 1rem}
.tl::before{content:"";position:absolute;left:-1.4rem;top:.35rem;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 10px var(--accent-soft)}
.tl.transfer::before{background:var(--accent)}
.tl.maint::before{border-color:var(--info)}
.tl b{font-size:.88rem}
.tl .when{font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
.tl p{font-size:.86rem;color:var(--fg-2)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.alt{fill:var(--info)}
.chart .bar.soft{fill:var(--mint);opacity:.55}
.chart .val{fill:var(--fg);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:.5rem .7rem;align-items:center;font-size:.84rem}
.hbar .track{height:10px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:6px}
.hbar .fill.warn{background:var(--warn)}
.hbar .fill.info{background:var(--info)}
.hbar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.li .ic svg{width:16px;height:16px}
.li .ic.info{background:var(--info-soft);color:var(--info)}
.li .ic.warn{background:var(--warn-soft);color:var(--warn)}
.li .body{min-width:0;flex:1 1 200px}
.li{flex-wrap:wrap}
.li .body p{font-size:.88rem}
.li .body small{font-size:.74rem;color:var(--muted)}
.li.unread .body p{font-weight:600}
.li.link{cursor:pointer}
.li.link:hover{background:var(--surface-2)}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,4,.62);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-top:max(5vh, env(safe-area-inset-top,0px));padding-bottom:max(5vh, env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.modal{width:100%;max-width:580px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;min-width:0}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.2rem 1.3rem .4rem}
.modal-b{padding:.8rem 1.3rem 1.2rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.modal-f{display:flex;justify-content:flex-end;gap:.5rem;padding:.9rem 1.3rem 1.2rem;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.4rem;line-height:1;padding:.2rem}
.toasts{position:fixed;z-index:100;bottom:max(1rem, env(safe-area-inset-bottom,0px));right:max(1rem, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:.5rem;max-width:min(380px,calc(100vw - 2rem))}
.toast{background:var(--surface);border:1px solid var(--accent-line);box-shadow:var(--glow);border-radius:12px;padding:.7rem .9rem;font-size:.88rem;animation:tin .25s ease}
.toast.err{border-color:color-mix(in srgb,var(--danger) 50%,transparent);box-shadow:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.price-box{border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.price-box .pl{display:flex;justify-content:space-between;gap:1rem;padding:.6rem .9rem;font-size:.9rem;border-bottom:1px solid var(--line)}
.price-box .pl:last-child{border-bottom:0}
.price-box .pl.total{background:var(--accent-soft);font-weight:700;font-size:1rem}
.price-box .pl span:last-child{font-variant-numeric:tabular-nums}
.thread{display:flex;flex-direction:column;gap:.5rem;max-height:260px;overflow:auto;padding:.2rem}
.msg{max-width:85%;padding:.5rem .75rem;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:.86rem}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent-line)}
.msg small{display:block;font-size:.7rem;color:var(--muted);margin-bottom:.15rem}
.steps-tx{display:flex;gap:.3rem;flex-wrap:wrap}
.steps-tx span{font-size:.72rem;padding:.2rem .5rem;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps-tx span.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}

/* invoice */
.invoice{background:#fff;color:#0b1810;border-radius:14px;padding:1.4rem;font-size:.86rem;border:1px solid var(--line)}
.invoice h3{color:#0b1810}
.invoice table{width:100%;border-collapse:collapse;margin:.9rem 0}
.invoice th,.invoice td{padding:.45rem .3rem;border-bottom:1px solid #e1e8e3;text-align:left}
.invoice .r{text-align:right;font-variant-numeric:tabular-nums}
.invoice .tot td{font-weight:700;border-bottom:0}
.invoice .muted{color:#5c7165}
.invoice .stamp{display:inline-block;border:1.5px solid #0e9c55;color:#0e9c55;font-weight:700;font-size:.7rem;letter-spacing:.1em;padding:.15rem .5rem;border-radius:6px;text-transform:uppercase}

/* rating */
.rate{display:flex;gap:.35rem;flex-wrap:wrap}
.rate label{cursor:pointer}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate span{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line-2);font-weight:700;font-family:var(--f-display)}
.rate input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.rate input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.q{padding:1rem 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.6rem}
.q:last-child{border-bottom:0}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.8rem;padding:3rem 1rem}
.lock svg{width:44px;height:44px;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.42rem .8rem;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.svc{border:1px solid var(--line-2);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.45rem;cursor:pointer}
.svc:has(input:checked){border-color:var(--accent);box-shadow:var(--glow)}
.svc input{accent-color:var(--accent)}
.public-wrap{max-width:900px;margin:0 auto;padding-block:1.5rem 4rem;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1.1rem}
.loading{min-height:100%;display:grid;place-items:center;gap:1rem;text-align:center;color:var(--muted)}
.loading img{width:90px;filter:drop-shadow(0 0 18px rgba(62,240,143,.5));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* bulk equipment registration */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.add-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:720px){.add-opts{grid-template-columns:1fr}}
.add-opt{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;padding:1rem;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;min-width:0}
.add-opt:hover{border-color:var(--accent-line);box-shadow:var(--glow)}
.add-opt svg{width:26px;height:26px;color:var(--accent);margin-bottom:.2rem}
.add-opt b{font-size:.95rem}
.add-opt .en{font-size:.72rem;color:var(--accent);font-weight:600;letter-spacing:.02em}
.add-opt span{font-size:.8rem;color:var(--muted)}
.bulk-card{border-color:var(--accent-line);background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--surface)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:1.4rem;text-align:center;color:var(--muted);font-size:.88rem}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1rem}
@media (max-width:640px){.map-grid{grid-template-columns:1fr}}
.map-row{display:grid;gap:.25rem;font-size:.84rem;font-weight:600;min-width:0}
.map-row small{font-weight:400;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-left:.3rem}
.imp-sum{display:flex;gap:.4rem;flex-wrap:wrap}
.imp-tbl{max-height:46vh;overflow:auto}
.imp-tbl table{min-width:1500px}
.imp-tbl td{padding:.35rem .4rem;vertical-align:top}
.imp-tbl .input{padding:.35rem .45rem;font-size:.8rem;min-width:110px}
.imp-tbl th{position:sticky;top:0;z-index:1}
.imp-st{min-width:150px;max-width:220px}
tr.r-err td{background:var(--danger-soft)}
tr.r-dup td{background:var(--warn-soft)}
.imp-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.imp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.imp-list{display:flex;flex-direction:column;gap:.2rem;max-height:260px;overflow:auto}
.imp-li{padding:.45rem .3rem;border-bottom:1px solid var(--line);align-items:flex-start}

const fdt = d => d ? new Date(d).toLocaleString("es-ES", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return "ahora"; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; if (s < 86400 * 30) return `hace ${Math.floor(s / 86400)} d`; return fdate(d); };

const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} };
async function sha(s) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("brota|" + s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("") } catch { let h = 0; for (const c of "brota|" + s) h = (h * 31 + c.charCodeAt(0)) | 0; return "w" + h } }

<script>

const STORE = { db: null, mode: "loading", ready: false, firstSnap: new Set(), writeQ: {}, seeding: false, staleNote: false };
const LS_KEY = "tracea-local-db-v1";

function saveLocal() { if (STORE.mode !== "local") return; try { localStorage.setItem(LS_KEY, JSON.stringify(S)) } catch {} }
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); COLS.forEach(c => S[c] = o[c] || {}) } } catch {} }

async function put(col, obj) {
  obj = clone(obj);
  S[col][obj.id] = obj;
  if (STORE.mode === "cloud") {
    const key = col + "/" + obj.id;
    const prev = STORE.writeQ[key] || Promise.resolve();
    const p = prev.then(() => STORE.db.collection(col).doc(obj.id).set(obj)).catch(e => onWriteError(e));
    STORE.writeQ[key] = p; scheduleRender(); return p;
  } else { saveLocal(); scheduleRender(); }
}
async function del(col, id) {
  delete S[col][id];
  if (STORE.mode === "cloud") { try { await STORE.db.collection(col).doc(id).delete() } catch (e) { onWriteError(e) } }
  else saveLocal();
  scheduleRender();
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === "invalid_argument" || code === "not_granted" || code === "revoked" || code === "capability_disabled") {
    if (STORE.mode === "cloud") {
      STORE.mode = "local"; saveLocal();
      toast("No tienes permiso de escritura en la base de datos compartida. Tus cambios se guardan ahora solo en este navegador.", true);
      softRender();
    }
  } else if (code === "quota_exceeded") toast("La base de datos de la demostración está llena. Pide al administrador que restablezca la demo.", true);
  else toast("No se pudo guardar el cambio. Inténtalo de nuevo en unos segundos.", true);
}

async function initStore() {
  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use("db") } catch { db = null }
  if (!db) { STORE.mode = "local"; loadLocal(); if (!S.meta.app) await seedAll(); STORE.ready = true; render(); return; }
  STORE.db = db; STORE.mode = "cloud";
  const timer = setTimeout(() => { if (!STORE.ready) { STORE.staleNote = true; STORE.ready = true; render(); } }, 10000);
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data() });
      S[col] = o;
      if (!snap.metadata.fromCache) STORE.firstSnap.add(col);
      if (!STORE.ready && STORE.firstSnap.size === COLS.length) {
        clearTimeout(timer); STORE.ready = true; STORE.staleNote = false;
        if (!S.meta.app && !STORE.seeding) seedAll().then(render); else { render(); migrateBrand().then(migrateRoles); }
        return;
      }
      if (STORE.ready) scheduleRender();
    }, err => { if (!STORE.ready) { clearTimeout(timer); STORE.mode = "local"; loadLocal(); if (!S.meta.app) seedAll(); STORE.ready = true; render(); } });
  });
}
/* one-time rename of stored demo data to the Tracea brand */
async function migrateBrand() {
  const app = S.meta.app; if (!app || app.brand === BRAND || STORE.mode !== "cloud") return;
  const OLD = "Bro" + "ta", oldMail = "bro" + "ta.demo", oldInv = "BR" + "T-";
  for (const col of COLS) { if (col === "meta") continue;
    for (const d of Object.values(S[col])) { const s = JSON.stringify(d); const t = s.split(OLD).join(BRAND).split(oldMail).join("tracea.demo").split(oldInv).join("TRC-"); if (t !== s) await put(col, JSON.parse(t)); if (STORE.mode !== "cloud") return; } }
  await put("meta", Object.assign(clone(app), { brand: BRAND }));
}
/* give every existing user an explicit role without removing anything: first/owner user of each institution = admin, others = member */
async function migrateRoles() {
  for (const u of Object.values(S.users)) {
    if (u.isAdmin || u.role) continue;
    const hasAdmin = Object.values(S.users).some(x => x.instId === u.instId && (x.role === "admin" || x.owner));
    await put("users", Object.assign(clone(u), { role: u.owner || !hasAdmin ? "admin" : "member" }));
    if (STORE.mode !== "cloud") return;
  }
}

    if (STORE.mode === "local") { writes.forEach(([c, d]) => S[c][d.id] = d); saveLocal(); }
  } else { writes.forEach(([c, d]) => S[c][d.id] = d); saveLocal(); }
  STORE.seeding = false;
}

const SESSION_KEY = "tracea-session";
let CUR = { userId: lsGet(SESSION_KEY) };
const me = () => S.users[CUR.userId] || null;
const myInst = () => (me() && S.inst[me().instId]) || null;
const isAdmin = () => !!(me() && me().isAdmin);
/* Institution roles: "admin" (Administrador institucional) manages users + institution data; "member" (Miembro) manages machinery and uses the platform. */
const ROLE_LABEL = { admin: "Administrador institucional", member: "Miembro" };
const userRole = u => !u ? "" : u.isAdmin ? "platform" : (u.role || (u.owner ? "admin" : "member"));
const isInstAdmin = () => userRole(me()) === "admin";
const instAdmins = instId => Object.values(S.users).filter(u => u.instId === instId && u.active !== false && userRole(u) === "admin");
const instName = id => (S.inst[id] && (S.inst[id].short || S.inst[id].name)) || "Institución";
const instFull = id => (S.inst[id] && S.inst[id].name) || "Institución";
function subActive(instId) { const s = S.subs[instId]; return !!(s && (s.status === "active" || (s.status === "cancelled" && new Date(s.renewAt) > new Date()))); }
function premiumActive(instId) { const p = S.premium[instId]; return !!(p && p.status === "active" && new Date(p.expiresAt) > new Date()); }
const catsFor = instId => premiumActive(instId) ? CATS.concat(CATS_PREMIUM) : CATS;
const eqList = () => Object.values(S.eq);
const ownedBy = id => eqList().filter(e => e.instId === id);
const formerOf = id => eqList().filter(e => e.instId !== id && (e.formerOwners || []).includes(id));
const listingFor = eqId => Object.values(S.listings).find(l => l.eqId === eqId && l.status === "active");
const txFor = id => Object.values(S.tx).filter(t => t.ownerInst === id || t.reqInst === id);

/* ---------- QR ---------- */
/* QR: integer module size, 4-module quiet zone, drawn at device resolution so no module is ever dropped by scaling */
function qrMatrix(text) { const q = new QRLib.QRCode(-1, QRLib.ECL.M); q.addData(text); q.make(); const n = q.getModuleCount(); const m = []; for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(q.isDark(r, c)); m.push(row); } return m; }

}
function drawQR(canvas, text) {

/* ---------- charts ---------- */
function columns(data, opts = {}) {

  let g = ""; for (let t = 0; t <= top; t += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  const bars = data.map((d, i) => {
    const x0 = pl + i * bw; const two = d.v2 != null; const w = two ? bw * .32 : bw * .56;
    const b1 = `<rect class="bar" x="${x0 + (two ? bw * .16 : bw * .22)}" y="${y(d.v)}" width="${w}" height="${Math.max(0, y(0) - y(d.v))}" rx="3"><title>${esc(d.l)}: ${d.v}</title></rect>`;
    const b2 = two ? `<rect class="bar alt" x="${x0 + bw * .52}" y="${y(d.v2)}" width="${w}" height="${Math.max(0, y(0) - y(d.v2))}" rx="3"><title>${esc(d.l)}: ${d.v2}</title></rect>` : "";
    return b1 + b2 + `<text x="${x0 + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(d.l)}</text>`;

}

function hbars(rows, cls) { const max = Math.max(1, ...rows.map(r => r.v)); return `<div class="hbar">${rows.map(r => `<span class="lab" title="${esc(r.l)}">${esc(r.l)}</span><div class="track"><div class="fill ${r.cls || cls || ""}" style="width:${(r.v / max) * 100}%"></div></div><span class="v">${r.fmt || r.v}</span>`).join("")}</div>`; }
function lastMonths(n) { const out = []; const d = new Date(); d.setDate(1); for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setMonth(d.getMonth() - i); out.push({ key: x.toISOString().slice(0, 7), l: x.toLocaleDateString("es-ES", { month: "short" }).replace(".", "") }); } return out; }

let PHOTO_DATA = null;
async function readPhoto(input) {
  const f = input.files[0]; if (!f) return;
  PHOTO_DATA = await resizeImage(f, 640, 0.72);
  const pv = $("#photo-preview"); if (pv) pv.innerHTML = `<img src="${PHOTO_DATA}" alt="Vista previa">`;
}
async function resizeImage(file, max, q) {
  const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
  const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return c.toDataURL("image/jpeg", q);
}

<script>

const normH = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

/* ---------- entry point: Añadir equipo ---------- */

function csvEscape(v) { v = String(v ?? ""); return /[";\n\r,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

  const blob = buildXlsx([{ name: "Maquinaria", rows: [TEMPLATE_HEADERS, ...TEMPLATE_EXAMPLES], widths: [34, 30, 18, 20, 20, 12, 36, 18, 44], header: true }, { name: "Instrucciones", rows: info, widths: [70] }]);

/* ---------- minimal ZIP + XLSX writer (no external libraries) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;

async function createPassportsBulk(ids) {

  const codes = fresh.map(e => e.code);
  const concept = fresh.length === 1 ? `Pasaporte digital ${codes[0]} – ${fresh[0].name}` : `Pasaportes digitales (${fresh.length}): ${codes.slice(0, 6).join(", ")}${codes.length > 6 ? ` y ${codes.length - 6} más` : ""}`;
  const inv = await createInvoice(inst.id, [{ kind: "passport", concept, qty: fresh.length, unit: PRICES.passport }]);
  const created = [];
  for (const e0 of fresh) {

/* operations list */

ACT.txTab = d => { TX_TAB = d.k; render(); };
ACT.openTx = async d => {

function txModal(id) {

    <div class="steps-tx">${["Solicitud enviada", "Pendiente de respuesta", "En negociación", "Aceptada", "Completada"].map((l, i) => `<span class="${reached(flow[i]) ? "on" : ""}">${l}</span>`).join("")}${["rejected", "cancelled"].includes(t.status) ? `<span class="on" style="color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)">${TX_STATUS[t.status][0]}</span>` : ""}</div>

    </div>

  </div>${actions ? `<div class="modal-f">${actions}</div>` : ""}`;
}
FORM.txMsg = async fd => { const t = clone(S.tx[fd.get("id")]); const inst = myInst(); t.messages.push({ instId: inst.id, user: me().name, text: String(fd.get("text")).trim(), at: TODAY() }); t.updatedAt = TODAY(); await put("tx", t); await notify(t.ownerInst === inst.id ? t.reqInst : t.ownerInst, `Nuevo mensaje de ${inst.short || inst.name} sobre «${S.eq[t.eqId]?.name}».`, "operaciones", t.id); const box = $("#modal-root .modal"); if (box) box.innerHTML = txModal(t.id); };
ACT.txDo = async (d, el) => {
  const t = clone(S.tx[d.id]); const inst = myInst(); const old = t.status; const e = S.eq[t.eqId];
  const other = t.ownerInst === inst.id ? t.reqInst : t.ownerInst;

  const msgBox = $("#tx-msg"); const typed = msgBox ? msgBox.value.trim() : "";
  if (d.do === "info" || d.do === "negotiate" || d.do === "counter") {
    const isNeg = d.do !== "info";
    openModal(modalHead(d.do === "info" ? "Solicitar más información" : d.do === "negotiate" ? "Iniciar negociación" : "Nueva oferta", esc(e.name)) + `<form data-form="txNeg"><input type="hidden" name="id" value="${t.id}"><input type="hidden" name="kind" value="${d.do}"><div class="modal-b">
      ${isNeg ? `<div class="field"><label for="ng-price">${d.do === "negotiate" ? "Contraoferta (€)" : "Tu nueva oferta (€)"}</label><input class="input" id="ng-price" name="price" type="number" min="0" step="50" required value="${t.price}"></div>` : ""}
      <div class="field"><label for="ng-msg">Mensaje</label><textarea class="input" id="ng-msg" name="msg" rows="3" required>${esc(typed)}</textarea></div></div>
      <div class="modal-f"><button class="btn ghost" type="button" data-act="openTx" data-id="${t.id}">Volver</button><button class="btn primary" type="submit">Enviar</button></div></form>`);
    return;
  }
  el.disabled = true;
  if (d.do === "accept") { t.status = "accepted"; await say(typed || "Solicitud aceptada. Coordinemos la entrega del equipo."); }
  if (d.do === "reject") { t.status = "rejected"; await say(typed || "Lo sentimos, no podemos aceptar la solicitud."); }
  if (d.do === "cancel") { t.status = "cancelled"; await say(typed || "Operación cancelada."); }
  if (d.do === "ownerOk") { t.ownerOk = true; await say("Entrega del equipo confirmada."); }
  if (d.do === "reqOk") { t.reqOk = true; if (t.op === "sell") t.payment = { ref: "SIM-" + Date.now().toString(36).toUpperCase(), amount: t.price, at: TODAY() }; await say(t.op === "sell" ? `Pago simulado de ${eur(t.price)} realizado y recepción confirmada.` : "Recepción del equipo confirmada."); }
  t.updatedAt = TODAY();
  if (t.status === "accepted" && t.ownerOk && t.reqOk) { await completeTx(t); }
  else { await put("tx", t); await afterStatusChange(t, old); }
  const box = $("#modal-root .modal"); if (box) box.innerHTML = txModal(t.id);
  toast(t.status === "completed" ? "Operación completada. Propietario e inventarios actualizados." : "Operación actualizada: " + TX_STATUS[t.status][0]);
};
FORM.txNeg = async fd => {
  const t = clone(S.tx[fd.get("id")]); const inst = myInst(); const kind = fd.get("kind");
  if (kind !== "info") t.price = +fd.get("price") || t.price;
  t.messages.push({ instId: inst.id, user: me().name, text: (kind === "info" ? "Solicitud de información: " : kind === "negotiate" ? `Contraoferta ${eur(t.price)}. ` : `Nueva oferta ${eur(t.price)}. `) + String(fd.get("msg")).trim(), at: TODAY() });
  const old = t.status; t.status = "negotiation"; t.updatedAt = TODAY(); await put("tx", t); await afterStatusChange(t, old);
  ACT.openTx({ id: t.id }); toast("Mensaje enviado. La operación está en negociación.");
};
async function afterStatusChange(t, old) {
  if (old === t.status) { await notify(t.ownerInst === myInst()?.id ? t.reqInst : t.ownerInst, `Actualización en la operación de «${S.eq[t.eqId]?.name}».`, "operaciones", t.id); return; }
  const e = S.eq[t.eqId]; const l = S.listings[t.listingId];
  if (t.status === "accepted") {
    for (const id of [t.eqId, t.offerEqId].filter(Boolean)) { const x = clone(S.eq[id]); x.status = "reserved"; x.timeline.push({ at: TODAY(), kind: "estado", text: `Reservado para ${OPS[t.op].toLowerCase()} entre ${instName(t.ownerInst)} y ${instName(t.reqInst)}`, instId: x.instId }); await put("eq", x); }
    if (l) { const y = clone(l); y.status = "reserved"; await put("listings", y); }
    for (const o of Object.values(S.tx)) if (o.id !== t.id && o.listingId === t.listingId && ["sent", "pending", "negotiation"].includes(o.status)) { const z = clone(o); z.status = "rejected"; z.updatedAt = TODAY(); z.messages.push({ instId: z.ownerInst, text: "El equipo se ha reservado para otra institución.", at: TODAY() }); await put("tx", z); await notify(z.reqInst, `Tu solicitud de «${e?.name}» ha sido rechazada: el equipo se ha reservado para otra institución.`, "operaciones", z.id); }
  }
  if ((t.status === "cancelled" || t.status === "rejected") && old === "accepted") {
    for (const id of [t.eqId, t.offerEqId].filter(Boolean)) { const x = clone(S.eq[id]); x.status = "available"; await put("eq", x); }
    if (l && l.status === "reserved") { const y = clone(l); y.status = "active"; await put("listings", y); }
  }
  const actor = myInst(); const who = actor ? (actor.short || actor.name) : "El administrador";
  for (const target of [t.ownerInst, t.reqInst]) if (!actor || target !== actor.id) await notify(target, `${who}: operación de ${OPS[t.op].toLowerCase()} de «${e?.name}» → ${TX_STATUS[t.status][0]}.`, "operaciones", t.id);
}
async function transferEq(eqId, from, to, t) {
  const x = clone(S.eq[eqId]); const now = TODAY();
  (x.owners || []).forEach(o => { if (!o.to) o.to = now; });
  x.owners = (x.owners || []).concat([{ instId: to, from: now, to: null }]);
  x.formerOwners = [...new Set((x.formerOwners || []).concat([from]))].filter(i => i !== to);
  x.instId = to; x.status = "in_use";
  x.location = (S.inst[to]?.city || "") + " · pendiente de asignar laboratorio";
  x.timeline.push({ at: now, kind: "transferencia", text: `${OPS[t.op]}: de ${instName(from)} a ${instName(to)}${t.op === "sell" ? " por " + eur(t.price) + " (pago simulado)" : ""}`, instId: to });
  x.timeline.push({ at: now, kind: "propietario", text: `Nuevo propietario: ${instFull(to)}. El historial anterior se conserva.`, instId: to });
  await put("eq", x);
}
async function completeTx(t) {
  t.status = "completed"; t.completedAt = TODAY(); t.updatedAt = TODAY();
  await transferEq(t.eqId, t.ownerInst, t.reqInst, t);
  if (t.op === "exchange" && t.offerEqId) await transferEq(t.offerEqId, t.reqInst, t.ownerInst, t);
  const l = S.listings[t.listingId]; if (l) { const y = clone(l); y.status = "closed"; y.closedAt = TODAY(); await put("listings", y); }
  for (const o of Object.values(S.listings)) if (t.offerEqId && o.eqId === t.offerEqId && o.status === "active") { const y = clone(o); y.status = "closed"; await put("listings", y); }
  await put("tx", t);
  await track("tx_completed", t.id);
  const e = S.eq[t.eqId];
  await notify(t.ownerInst, `Operación completada: «${e?.name}» se ha transferido a ${instName(t.reqInst)}.`, "operaciones", t.id);
  await notify(t.reqInst, `Operación completada: «${e?.name}» ya figura en tu inventario con su pasaporte digital.`, "inventario", t.id);
}

/* ---------- analytics ---------- */
const CO2_FACTOR = 0.35; // kg CO2e por euro de equipo nuevo no adquirido — hipótesis orientativa
function analyticsData(id) {
  const eqs = ownedBy(id), former = formerOf(id), txs = txFor(id);
  const received = eqs.filter(e => (e.formerOwners || []).length);
  const under = eqs.filter(e => e.status !== "maintenance" && (e.usage || 0) < 10);
  const done = txs.filter(t => t.status === "completed");
  const lifeExt = former.concat(received).reduce((s, e) => s + (e.lifeYears || 0), 0);
  const avoidedVal = received.reduce((s, e) => s + (e.newValue || 0), 0);
  return { eqs, former, txs, received, under, done, lifeExt, avoidedVal, co2: avoidedVal * CO2_FACTOR / 1000 };
}

function canManageUser(u) { return isAdmin() || (isInstAdmin() && u && u.instId === me().instId && u.id !== me().id); }

ACT.toggleUser = async d => { const u = clone(S.users[d.id]); if (!canManageUser(u)) { requireInstAdmin("La gestión de usuarios"); return; } if (u.active !== false && !lastAdminGuard(u, userRole(u), false)) return; u.active = u.active === false; await put("users", u); toast(u.active ? "Usuario activado." : "Usuario desactivado."); };

ACT.readAll = async () => { for (const n of myNotifs().filter(n => !n.read)) { const x = clone(n); x.read = true; await put("notif", x); } toast("Notificaciones marcadas como leídas."); };

function viewSettings() {

}
FORM.saveProfile = async fd => { const u = clone(me()); u.name = String(fd.get("name")).trim(); u.position = String(fd.get("position")).trim(); await put("users", u); toast("Perfil guardado."); FORMVIEW = false; render(); };
FORM.savePw = async (fd, f) => { const u = clone(me()); if (u.pw !== await sha(fd.get("old"))) { toast("La contraseña actual no es correcta.", true); return; } u.pw = await sha(fd.get("pw")); await put("users", u); f.reset(); toast("Contraseña actualizada."); };

/* ---------- feedback ---------- */
const FB_Q = [
  ["easeRegister", "¿Te ha resultado fácil registrar una máquina?"],
  ["passportInfo", "¿La información del pasaporte digital te parece suficiente?"],
  ["maintUseful", "¿Consideras útil consultar el historial de mantenimiento?"],
  ["marketUse", "¿Utilizarías el marketplace para transferir maquinaria?"],

];
const FB_FEATURES = ["Pasaporte digital y código QR", "Historial de mantenimiento", "Marketplace entre centros", "Intercambio de maquinaria", "Analítica y sostenibilidad", "Servicios de verificación", "Gestión del inventario"];
let FB_SENT = false;
function viewFeedback() {

  const mine = Object.values(S.fb).filter(f => f.userId === me().id);
  if (FB_SENT) return `<div class="card lock">${ICON.check}<h2>¡Gracias por tu opinión!</h2><p class="muted" style="max-width:50ch">Tus respuestas se han guardado y el equipo de ${BRAND} las analizará para mejorar la plataforma.</p><div class="row"><button class="btn" data-act="fbAgain">Enviar otra valoración</button><a class="btn primary" href="#panel">Volver al panel</a></div></div>`;

    ${FB_Q.map(([k, q]) => `<div class="q"><p><b>${q}</b></p><div class="rate" role="radiogroup" aria-label="${esc(q)}">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="${k}" value="${n}" required><span>${n}</span></label>`).join("")}</div></div>`).join("")}
    <div class="q"><label for="fb-feat"><b>¿Qué funcionalidad te parece más interesante?</b></label><select class="input" id="fb-feat" name="feature" required><option value="">Elige una opción</option>${FB_FEATURES.map(f => `<option>${f}</option>`).join("")}</select></div>
    <div class="q"><label for="fb-price"><b>¿Qué precio mensual considerarías razonable?</b></label><div class="row"><input class="input" id="fb-price" name="price" type="number" min="0" step="1" placeholder="59" style="max-width:160px"><span class="muted">€ / mes por institución</span></div></div>
    <div class="q"><label for="fb-improve"><b>¿Qué mejorarías?</b></label><textarea class="input" id="fb-improve" name="improve" rows="3" placeholder="Funciones que faltan, pasos confusos, datos del pasaporte…"></textarea></div>
    <div class="q"><label for="fb-comments"><b>Comentarios adicionales</b></label><textarea class="input" id="fb-comments" name="comments" rows="2"></textarea></div>
    <div class="row" style="justify-content:flex-end;margin-top:.6rem"><button class="btn primary" type="submit">Enviar valoración</button></div>
  </form>`;
}
FORM.saveFb = async fd => {
  const u = me(); const r = {}; FB_Q.forEach(([k]) => r[k] = +fd.get(k));
  await put("fb", { id: uid("fb"), userId: u.id, instId: u.instId, ratings: r, feature: fd.get("feature"), price: fd.get("price") === "" ? null : +fd.get("price"), improve: String(fd.get("improve") || "").trim(), comments: String(fd.get("comments") || "").trim(), at: TODAY() });

};
ACT.fbAgain = () => { FB_SENT = false; render(); };
</script>
<script>
/* =========================================================
   Admin panel + public passport + boot
   ========================================================= */
function adminView(v) {
  switch (v) {
    case "admin-inst": return ["Instituciones", admInst()];
    case "admin-users": return ["Usuarios", admUsers()];
    case "admin-listings": return ["Anuncios del marketplace", admListings()];
    case "admin-tx": return ["Solicitudes y operaciones", admTx()];
    case "admin-verif": return ["Servicios de verificación", admVerif()];
    case "admin-subs": return ["Suscripciones", admSubs()];
    case "admin-billing": return ["Facturación", admBilling()];
    case "admin-feedback": return ["Feedback de usuarios", admFeedback()];
    case "admin-events": return ["Eventos de uso", admEvents()];
    case "admin-demo": return ["Escenario de demostración", admDemo()];
    default: return ["Resumen global", admHome()];
  }
}
const sumBase = (invs, kind) => invs.reduce((t, i) => t + i.lines.filter(l => !kind || l.kind === kind).reduce((a, l) => a + l.qty * l.unit, 0), 0);
function fbStats() {
  const fbs = Object.values(S.fb); const avg = k => fbs.length ? (fbs.reduce((s, f) => s + (f.ratings?.[k] || 0), 0) / fbs.length) : 0;
  const prices = fbs.map(f => f.price).filter(p => p != null && !isNaN(p)).sort((a, b) => a - b);
  return { fbs, avg, prices, median: prices.length ? prices[Math.floor(prices.length / 2)] : null, mean: prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : null };
}
const FUNNEL = ["register_started", "register_completed", "subscription_started", "passport_created", "passport_viewed", "listing_published", "request_sent", "tx_completed", "service_requested"];
function admHome() {
  const inst = Object.values(S.inst), invs = Object.values(S.inv), tx = Object.values(S.tx), ev = Object.values(S.ev);
  const activeSubs = Object.values(S.subs).filter(s => s.status === "active").length;
  const pend = inst.filter(i => i.status === "pending");
  const F = fbStats();
  const k = (l, v, s, hl) => `<div class="kpi ${hl ? "hl" : ""}"><span class="k-l">${l}</span><span class="k-v">${v}</span><span class="k-s">${s}</span></div>`;
  const months = lastMonths(6);
  return `<div class="kpis">
    ${k("Instituciones", inst.length, `${inst.filter(i => i.status === "verified").length} verificadas · ${pend.length} pendientes`, true)}
    ${k("Usuarios", Object.values(S.users).filter(u => !u.isAdmin).length, "Cuentas institucionales")}
    ${k("Equipos / pasaportes", `${eqList().length} / ${eqList().filter(e => e.passport?.active).length}`, "Registrados / activos")}
    ${k("Operaciones", tx.length, `${tx.filter(t => openTxStatuses.includes(t.status)).length} abiertas · ${tx.filter(t => t.status === "completed").length} completadas`)}
    ${k("Ingreso recurrente mensual", eur(activeSubs * PRICES.sub), `${activeSubs} suscripciones activas × 59 €`)}
    ${k("Facturación total (base)", eur(sumBase(invs)), `${invs.length} facturas simuladas`)}
    ${k("Valoración media", F.fbs.length ? (FB_Q.reduce((s, [q]) => s + F.avg(q), 0) / FB_Q.length).toFixed(1) + " / 5" : "—", `${F.fbs.length} respuesta(s) de feedback`)}
    ${k("Eventos registrados", ev.length, "Interacciones del MVP")}
  </div>
  ${pend.length ? `<section class="card"><div class="card-h"><h3>Instituciones pendientes de verificación</h3><a class="btn sm ghost" href="#admin-inst">Gestionar</a></div><div class="list">${pend.map(i => `<div class="li"><div class="ic warn">${ICON.inst}</div><div class="body"><p>${esc(i.name)}</p><small>${esc(i.type)} · ${esc(i.city)} · ${esc(i.contact)} · registrada ${ago(i.createdAt)}</small></div><button class="btn sm danger" data-act="admInstSet" data-id="${i.id}" data-s="rejected">Rechazar</button><button class="btn sm primary" data-act="admInstSet" data-id="${i.id}" data-s="verified">Verificar</button></div>`).join("")}</div></section>` : ""}
  <div class="cols even">
    <section class="card"><div class="card-h"><h3>Ingresos por flujo (base imponible)</h3></div>${hbars([["Suscripción mensual", "sub"], ["Tarifa por pasaporte", "passport"], ["Servicios de verificación", "verif"], ["Paquete Premium", "premium"]].map(([l, kd]) => ({ l, v: sumBase(invs, kd), fmt: eur(sumBase(invs, kd)) })))}</section>
    <section class="card"><div class="card-h"><h3>Facturación mensual</h3></div>${columns(months.map(m => ({ l: m.l, v: Math.round(sumBase(invs.filter(i => i.at.startsWith(m.key)))) })), { label: "Facturación mensual" })}</section>
  </div>
  <section class="card"><div class="card-h"><h3>Embudo de uso del MVP</h3><a class="btn sm ghost" href="#admin-events">Ver eventos</a></div>${hbars(FUNNEL.map(t => ({ l: EV_LABELS[t], v: ev.filter(e => e.type === t).length })))}</section>`;
}
function admInst() {
  const list = Object.values(S.inst).sort((a, b) => ({ pending: 0, rejected: 2, verified: 1 }[a.status] - { pending: 0, rejected: 2, verified: 1 }[b.status]) || b.createdAt.localeCompare(a.createdAt));
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Institución</th><th>Tipo · ubicación</th><th>Responsable</th><th>Estado</th><th>Suscripción</th><th>Publicar</th><th class="r">Acciones</th></tr></thead><tbody>

  </tbody></table></div>`;
}
ACT.admInstSet = async d => { const i = clone(S.inst[d.id]); i.status = d.s; if (d.s === "verified") i.verifiedAt = TODAY(); await put("inst", i); await notify(i.id, d.s === "verified" ? "Tu institución ha sido verificada. Ya puedes usar el marketplace." : d.s === "rejected" ? "La verificación de tu institución ha sido rechazada. Revisa los datos del perfil." : "Tu institución vuelve a estar pendiente de verificación.", "institucion"); toast(`${i.short || i.name}: ${INST_STATUS[d.s][0]}`); };
ACT.admPublish = async d => { const i = clone(S.inst[d.id]); i.canPublish = i.canPublish === false; await put("inst", i); toast(i.canPublish ? "Permiso de publicación concedido." : "Permiso de publicación retirado."); };
function admUsers() {

  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Institución</th><th>Cargo</th><th>Alta</th><th>Estado</th><th class="r">Acciones</th></tr></thead><tbody>

  </tbody></table></div>`;
}
ACT.admResetPw = async d => { const u = clone(S.users[d.id]); u.pw = await sha("demo1234"); await put("users", u); toast(`Contraseña de ${u.name} restablecida a demo1234.`); };
function admListings() {

function admVerif() {
  const list = Object.values(S.verif).sort((a, b) => ({ requested: 0, review: 1, done: 2, cancelled: 3 }[a.status] - { requested: 0, review: 1, done: 2, cancelled: 3 }[b.status]) || b.at.localeCompare(a.at));
  return `<div class="banner info"><p>La verificación documental revisa documentos; la técnica avanzada incluye inspección del equipo. Ninguna equivale a una certificación acreditada.</p></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Servicio</th><th>Equipo</th><th>Institución</th><th class="r">Precio</th><th>Fecha</th><th>Estado</th><th>Resultado</th><th></th></tr></thead><tbody>
  ${list.map(v => `<tr><td>${esc(VERIF[v.kind].name)}</td><td class="mono small">${esc(S.eq[v.eqId]?.code || "")}</td><td class="small">${esc(instName(v.instId))}</td><td class="r num">${eur(v.price)}</td><td class="small">${fdate(v.at)}</td><td>${chip(VERIF_STATUS[v.status])}</td><td class="small" style="max-width:260px">${esc(v.result || "—")}</td><td class="r"><button class="btn sm" data-act="admVerifEdit" data-id="${v.id}">Registrar resultado</button></td></tr>`).join("") || `<tr><td colspan="8" class="empty">Sin solicitudes.</td></tr>`}
  </tbody></table></div>`;
}
ACT.admVerifEdit = d => {
  const v = S.verif[d.id];
  openModal(modalHead("Resultado de la verificación", `${esc(VERIF[v.kind].name)} · ${esc(S.eq[v.eqId]?.code)}`) + `<form data-form="saveVerifRes"><input type="hidden" name="id" value="${v.id}"><div class="modal-b">
    <div class="grid2"><div class="field"><label for="vr-st">Estado</label><select class="input" id="vr-st" name="status">${Object.entries(VERIF_STATUS).map(([k, [l]]) => `<option value="${k}" ${v.status === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="vr-out">Conclusión</label><select class="input" id="vr-out" name="outcome"><option value="">—</option><option value="ok" ${v.outcome === "ok" ? "selected" : ""}>Conforme</option><option value="obs" ${v.outcome === "obs" ? "selected" : ""}>Conforme con observaciones</option><option value="ko" ${v.outcome === "ko" ? "selected" : ""}>No conforme</option></select></div></div>
    <div class="field"><label for="vr-res">Resultado de la revisión</label><textarea class="input" id="vr-res" name="result" rows="4">${esc(v.result || "")}</textarea></div>
  </div><div class="modal-f"><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
};
FORM.saveVerifRes = async fd => {
  const v = clone(S.verif[fd.get("id")]); v.status = fd.get("status"); v.outcome = fd.get("outcome"); v.result = String(fd.get("result")).trim(); if (v.status === "done") v.doneAt = TODAY();
  await put("verif", v);
  if (v.status === "done") { const e = clone(S.eq[v.eqId]); e.timeline.push({ at: TODAY(), kind: "verificacion", text: `${VERIF[v.kind].name} completada: ${{ ok: "conforme", obs: "conforme con observaciones", ko: "no conforme" }[v.outcome] || "resultado registrado"}`, instId: e.instId }); await put("eq", e); }
  await notify(v.instId, `${VERIF[v.kind].name} (${S.eq[v.eqId]?.code}): ${VERIF_STATUS[v.status][0]}.`, "facturacion");
  closeModal(); toast("Resultado registrado.");
};
function admSubs() {
  const insts = Object.values(S.inst);
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Institución</th><th>Suscripción</th><th>Desde</th><th>Renovación / fin</th><th class="r">Cuota</th><th>Premium</th></tr></thead><tbody>
  ${insts.map(i => { const s = S.subs[i.id], p = S.premium[i.id]; return `<tr><td class="t-main">${esc(i.short || i.name)}</td><td>${s ? chip(s.status === "active" ? ["Activa", "ok"] : ["Cancelada", "warn"]) : chip(["Sin contratar", ""])}</td><td class="small">${s ? fdate(s.startedAt) : "—"}</td><td class="small">${s ? fdate(s.renewAt) : "—"}</td><td class="r num">${s ? "59 €/mes" : "—"}</td><td>${premiumActive(i.id) ? chip(["Hasta " + fdate(p.expiresAt), "ok"]) : "—"}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function admBilling() {
  const invs = Object.values(S.inv).sort((a, b) => b.at.localeCompare(a.at));
  return `<div class="kpis">${[["Suscripciones", "sub"], ["Pasaportes", "passport"], ["Verificaciones", "verif"], ["Premium", "premium"]].map(([l, k], i) => `<div class="kpi ${i ? "" : "hl"}"><span class="k-l">${l}</span><span class="k-v">${eur(sumBase(invs, k))}</span><span class="k-s">Base imponible acumulada</span></div>`).join("")}</div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Factura</th><th>Institución</th><th>Fecha</th><th>Conceptos</th><th class="r">Base</th><th class="r">IVA</th><th class="r">Total</th></tr></thead><tbody>
  ${invs.map(i => `<tr class="click" data-act="viewInv" data-id="${i.id}"><td class="mono">${i.number}</td><td class="small">${esc(instName(i.instId))}</td><td class="small">${fdate(i.at)}</td><td class="small">${esc(i.lines.map(l => l.concept).join(", "))}</td><td class="r num">${eur(i.base)}</td><td class="r num">${eur(i.iva)}</td><td class="r num"><b>${eur(i.total)}</b></td></tr>`).join("")}
  </tbody></table></div>`;
}
function admFeedback() {
  const F = fbStats(); const feats = {}; F.fbs.forEach(f => feats[f.feature] = (feats[f.feature] || 0) + 1);
  return `<div class="row between"><p class="muted">${F.fbs.length} respuesta(s) guardadas en la base de datos.</p><button class="btn" data-act="dlFb" ${F.fbs.length ? "" : "disabled"}>${ICON.download} Exportar CSV</button></div>
  <div class="cols even"><section class="card"><div class="card-h"><h3>Valoración media (1–5)</h3></div>${F.fbs.length ? hbars(FB_Q.map(([k, q]) => ({ l: q.replace(/\s*\(.*\)/, ""), v: +F.avg(k).toFixed(2), fmt: F.avg(k).toFixed(1) }))) : `<p class="empty">Aún no hay respuestas.</p>`}</section>
  <section class="card stack"><div class="card-h" style="margin:0"><h3>Funcionalidad más interesante</h3></div>${Object.keys(feats).length ? hbars(Object.entries(feats).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v }))) : `<p class="empty">—</p>`}
    <div class="hr"></div><p class="small">Precio razonable declarado: ${F.prices.length ? `media <b>${eur(F.mean)}</b> · mediana <b>${eur(F.median)}</b> · rango ${eur(F.prices[0])}–${eur(F.prices[F.prices.length - 1])} (${F.prices.length} respuestas)` : "sin datos"}</p>
    <p class="small">Disposición a pagar 59 €/mes (≥ 4): <b>${F.fbs.length ? Math.round(F.fbs.filter(f => f.ratings?.pay59 >= 4).length / F.fbs.length * 100) : 0} %</b></p></section></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Usuario</th>${FB_Q.map((_, i) => `<th class="r">P${i + 1}</th>`).join("")}<th>Funcionalidad</th><th class="r">Precio</th><th>Mejoras / comentarios</th></tr></thead><tbody>
  ${F.fbs.sort((a, b) => b.at.localeCompare(a.at)).map(f => `<tr><td class="small">${fdate(f.at)}</td><td class="small">${esc(S.users[f.userId]?.name || "")}<div class="t-sub">${esc(instName(f.instId))}</div></td>${FB_Q.map(([k]) => `<td class="r num">${f.ratings?.[k] || "—"}</td>`).join("")}<td class="small">${esc(f.feature)}</td><td class="r num">${f.price != null ? eur(f.price) : "—"}</td><td class="small" style="max-width:300px">${esc([f.improve, f.comments].filter(Boolean).join(" · ") || "—")}</td></tr>`).join("") || `<tr><td colspan="${FB_Q.length + 5}" class="empty">Sin respuestas.</td></tr>`}
  </tbody></table></div><p class="tiny muted">P1 registro de máquina · P2 información del pasaporte · P3 utilidad del historial · P4 uso del marketplace · P5 pagaría 59 €/mes.</p>`;
}
ACT.dlFb = async () => { const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; const rows = [["Fecha", "Usuario", "Institución", ...FB_Q.map(x => x[1]), "Funcionalidad", "Precio razonable", "Mejoras", "Comentarios"].map(q).join(";")]; Object.values(S.fb).forEach(f => rows.push([f.at, S.users[f.userId]?.name, instName(f.instId), ...FB_Q.map(([k]) => f.ratings?.[k]), f.feature, f.price, f.improve, f.comments].map(q).join(";"))); if (await saveFile("feedback_tracea.csv", "﻿" + rows.join("\n"))) toast("Feedback exportado."); };
function admEvents() {
  const ev = Object.values(S.ev).sort((a, b) => b.at.localeCompare(a.at)); const types = Object.keys(EV_LABELS);
  return `<div class="row between"><p class="muted">${ev.length} evento(s) de interacción registrados.</p><button class="btn" data-act="dlEv" ${ev.length ? "" : "disabled"}>${ICON.download} Exportar CSV</button></div>
  <div class="cols even"><section class="card"><div class="card-h"><h3>Eventos por tipo</h3></div>${hbars(types.map(t => ({ l: EV_LABELS[t], v: ev.filter(e => e.type === t).length })).filter(r => r.v || FUNNEL.includes(types.find(t => EV_LABELS[t] === r.l))))}</section>
  <section class="card"><div class="card-h"><h3>Uso por institución</h3></div>${(() => { const by = {}; ev.forEach(e => { if (e.instId && e.instId !== "admin" && e.instId !== "anon") by[e.instId] = (by[e.instId] || 0) + 1; }); const r = Object.entries(by).sort((a, b) => b[1] - a[1]); return r.length ? hbars(r.map(([i, v]) => ({ l: instName(i), v }))) : `<p class="empty">Sin datos.</p>`; })()}</section></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Evento</th><th>Usuario</th><th>Institución</th><th>Referencia</th></tr></thead><tbody>
  ${ev.slice(0, 120).map(e => `<tr><td class="small num">${fdt(e.at)}</td><td>${esc(EV_LABELS[e.type] || e.type)}</td><td class="small">${esc(S.users[e.userId]?.name || (e.instId === "anon" ? "Visitante sin sesión" : "—"))}</td><td class="small">${e.instId === "admin" ? "Administración" : e.instId === "anon" ? "—" : esc(instName(e.instId))}</td><td class="small mono">${esc(e.ref)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Todavía no hay eventos. Se registran al usar la plataforma.</td></tr>`}
  </tbody></table></div>`;
}
ACT.dlEv = async () => { const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; const rows = [["Fecha", "Evento", "Usuario", "Institución", "Referencia"].map(q).join(";")]; Object.values(S.ev).sort((a, b) => a.at.localeCompare(b.at)).forEach(e => rows.push([e.at, EV_LABELS[e.type] || e.type, S.users[e.userId]?.name, instName(e.instId), e.ref].map(q).join(";"))); if (await saveFile("eventos_tracea.csv", "﻿" + rows.join("\n"))) toast("Eventos exportados."); };
function admDemo() {
  return `<section class="card pad-lg stack" style="max-width:760px"><h2>Escenario de demostración</h2>
    <p>La plataforma incluye cinco instituciones (AITEX, UPV, AIMPLAS, ITENE y Leitat, esta última pendiente de verificación), diez equipos con pasaporte e historial, anuncios activos, una donación completada y una solicitud pendiente.</p>
    <ol class="small" style="margin:0;padding-left:1.2rem;display:grid;gap:.3rem"><li>Entra como <b>Álvaro García (AITEX)</b>: registra una máquina de ensayo textil, crea su pasaporte (2 € + IVA) o importa varias máquinas desde Excel, añade documentos y mantenimiento y publícala en el marketplace.</li><li>Entra como <b>Marta Ruiz (UPV)</b>: busca el equipo, consulta su pasaporte y solicita la compra o la donación.</li><li>Vuelve como Álvaro: acepta la solicitud y confirma la entrega. Marta confirma el pago simulado y la recepción.</li><li>Comprueba que el propietario, los inventarios y la línea temporal del pasaporte se han actualizado.</li></ol>
    <div class="banner warn"><p>Restablecer borra todos los datos (instituciones nuevas, operaciones, feedback y eventos) y vuelve a cargar el escenario inicial.</p></div>
    <div><button class="btn danger" data-act="admReset">Restablecer datos de demostración</button></div></section>`;
}
ACT.admReset = () => openModal(modalHead("¿Restablecer la demostración?") + `<div class="modal-b"><p>Se eliminarán todos los datos actuales, incluidos el feedback y los eventos recogidos, y se cargará el escenario inicial. Esta acción no se puede deshacer.</p></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="admResetGo">Sí, restablecer</button></div>`);
ACT.admResetGo = async (d, el) => { el.disabled = true; el.textContent = "Restableciendo…"; await resetDemo(); closeModal(); toast("Escenario de demostración restablecido."); CUR.userId = "u-admin"; lsSet(SESSION_KEY, "u-admin"); render(); };

/* ---------- public passport (sin sesión) ---------- */
let ANON_TRACKED = new Set();
function viewPublicPassport(id) {
  const eq = S.eq[id];
  const head = `<div class="row between"><div class="row"><img src="${LOGO}" alt="" style="width:42px;filter:drop-shadow(0 0 10px rgba(62,240,143,.45))"><div><b style="font-family:var(--f-display);font-size:1.1rem">${BRAND}</b><p class="tiny muted">Vista pública del pasaporte digital</p></div></div><button class="btn sm" data-act="pubLogin">Iniciar sesión</button></div>`;
  if (!eq || !eq.passport?.active) return `<div class="public-wrap">${head}<div class="card lock">${ICON.pass}<h2>Pasaporte no disponible</h2><p class="muted" style="max-width:50ch">${STORE.mode === "local" && !Object.keys(S.eq).length ? "No se pudo acceder a la base de datos de la plataforma desde esta vista." : "Este enlace no corresponde a un pasaporte activo, o necesitas iniciar sesión en claude.ai para consultarlo."}</p></div></div>`;
  if (!ANON_TRACKED.has(id)) { ANON_TRACKED.add(id); setTimeout(() => track("passport_viewed", id), 0); }
  const vis = eq.vis || {}; const listing = listingFor(eq.id);
  return `<div class="public-wrap">${head}
    <div class="card pad-lg"><div class="pp-head"><div class="pp-id"><div class="pp-thumb">${eq.photo ? `<img src="${eq.photo}" alt="">` : eqArt(eq.category)}</div><div class="stack sm"><p class="eyebrow">Pasaporte digital de maquinaria</p><h1 style="font-size:1.5rem">${esc(eq.name)}</h1><div class="row"><span class="tag mono">${esc(eq.code)}</span>${eqChip(eq.status)}${listing ? `<span class="op-chip ${listing.op}">${OPS[listing.op]}</span>` : ""}</div><p class="small muted">${esc(instFull(eq.instId))} · ${esc(S.inst[eq.instId]?.city || "")}</p></div></div>
    <div class="qr-card"><canvas width="300" height="300" data-qr="${esc(passportUrl(eq))}" aria-label="Código QR"></canvas><span class="tiny muted">Identificador permanente</span></div></div></div>
    <section class="card"><div class="sec-h"><h2><span class="letter">A</span>Identidad del producto</h2></div><dl class="kv"><dt>Fabricante</dt><dd>${esc(eq.manufacturer)}</dd><dt>Modelo</dt><dd>${esc(eq.model)}</dd><dt>Año de fabricación</dt><dd>${esc(eq.year)}</dd>${vis.serial !== false ? `<dt>Número de serie</dt><dd class="mono">${esc(eq.serial)}</dd>` : ""}<dt>Categoría</dt><dd>${esc(eq.category)}</dd><dt>Estado de conservación</dt><dd>${esc(eq.condition)}</dd></dl></section>
    ${vis.specs !== false ? `<section class="card"><div class="sec-h"><h2><span class="letter">B</span>Información técnica</h2></div><dl class="kv"><dt>Especificaciones</dt><dd>${esc(eq.specs)}</dd><dt>Capacidad</dt><dd>${esc(eq.capacity)}</dd><dt>Características</dt><dd>${esc(eq.features)}</dd></dl></section>` : ""}
    ${vis.maint !== false ? `<section class="card"><div class="sec-h"><h2><span class="letter">C</span>Mantenimiento</h2></div><div class="list">${(eq.maint || []).slice().sort((a, b) => b.date.localeCompare(a.date)).map(m => `<div class="li"><div class="ic info">${ICON.wrench}</div><div class="body"><p>${esc(m.type)}: ${esc(m.desc)}</p><small>${fdate(m.date)} · ${esc(m.tech)}</small></div></div>`).join("") || `<p class="muted small">Sin registros.</p>`}</div></section>` : ""}
    ${vis.timeline !== false ? `<section class="card"><div class="sec-h"><h2><span class="letter">D</span>Ciclo de vida</h2></div><div class="timeline">${(eq.timeline || []).slice().sort((a, b) => b.at.localeCompare(a.at)).map(t => `<div class="tl ${t.kind === "transferencia" ? "transfer" : ""}"><span class="when">${fdate(t.at)}</span><p>${esc(t.text)}</p></div>`).join("")}</div></section>` : ""}
    <p class="tiny muted">Información pública compartida por la institución propietaria. Los documentos internos y datos sensibles no se muestran.</p></div>`;
}
ACT.pubLogin = () => { AUTH.tab = "login"; location.hash = ""; render(); };

/* ---------- boot ---------- */
(function boot() {
  if (lsGet("tracea-theme") === "light") document.documentElement.setAttribute("data-tracea", "light");
  initStore();
})();
</script>
</body></html>
